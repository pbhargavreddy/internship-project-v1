# .streamlit/config.toml
# research_assistant/.streamlit is a symlink to this folder, because Streamlit reads
# .streamlit/ from the directory it is started in (run.sh starts it in research_assistant/).
#
# No `base` → the app follows the system light/dark setting by default. Users can
# switch with the sidebar's Dark/Light mode button (or Settings → Theme).

[theme]
font = "sans serif"

[theme.light]
primaryColor              = "#4F46E5"
backgroundColor           = "#FFFFFF"
secondaryBackgroundColor  = "#F5F6FA"
textColor                 = "#1F2937"

[theme.dark]
primaryColor              = "#818CF8"
backgroundColor           = "#0F1117"
secondaryBackgroundColor  = "#1A1D2E"
textColor                 = "#E5E7EB"
